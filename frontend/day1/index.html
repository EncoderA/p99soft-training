<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="./style.css"> -->
    <style>
        * {
            font-size: 18px;
            padding: 0px;
            margin: 0px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgb(228, 242, 255);
            padding: 20px;
            position: sticky;
        }

        .nav-items {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 28px;
        }

        li,
        a {
            list-style: none;
            text-decoration: none;
            color: rgb(31, 41, 55);
        }

        .login-button {
            padding: 8px 24px;
            border-radius: 8px;
            border-width: 1px;
            background-color: rgb(59, 130, 246);
            color: rgb(255, 255, 255);
            border-color: rgb(37, 99, 235);
        }

        aside {
            display: flex;
            justify-content: start;
            align-items: start;
            padding: 18px;
            gap: 8px;
            /* border: 1px solid black; */
            background-color: rgb(239, 246, 255);
            width: 200px;
            height: calc(100vh - 88px);
        }

        .main-aside {
            display: flex;
            justify-content: space-between;
        }

        .aside-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>



<body class="relative h-screen">
    <header class="header">
        <img src="" alt="logo" class="logo" />
        <div class="nav-items">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </div>
        <button class="login-button">login</button>
    </header>
    <div class="main-aside">
        <main class="w-full  p-6 flex items-center justify-center">
            <div class="grid grid-cols-3 gap-12">
                <div class="bg-sky-300 row-span-2 min-size-32 rounded-xl"></div>
                <div class="bg-sky-300 size-32 rounded-xl"></div>
                <div class="bg-sky-300 size-32 rounded-xl"></div>
                <div class="bg-sky-300 size-32 rounded-xl"></div>
                <div class="bg-sky-300 size-32 rounded-xl"></div>
                <div class="bg-sky-300 size-32 rounded-xl"></div>
                <div class="bg-sky-300 size-32 rounded-xl"></div>
                <div class="bg-sky-300 size-32 rounded-xl"></div>
            </div>
        </main>
        <aside class="bg-">
            <div class="aside-items">
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </div>
        </aside>
    </div>
    <footer></footer>
    <div class="absolute bottom-6 right-6 size-16 bg-sky-700 text-white rounded-full flex items-center justify-center">
        chat
    </div>
</body>


</html>
